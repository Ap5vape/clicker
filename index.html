<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prime Vapor Clicker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Шапка со статусом и балансом -->
    <header class="header">
      <div class="status-badge" id="player-status">Респектовый</div>
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-label">Клики:</span>
          <span class="stat-val" id="clicks-display">0</span>
        </div>
        <div class="stat-card prime">
          <span class="stat-label">PrimeCoins:</span>
          <span class="stat-val" id="coins-display">0</span>
        </div>
      </div>
    </header>

    <!-- Игровая область -->
    <main class="view-tab active" id="tab-game">
      <div class="tank-viewport">
        <!-- Холст для реалистичного пара за баком -->
        <canvas id="steam-canvas"></canvas>
        <div class="tank-container" id="tank-target">
          <div class="tank-halo"></div>
          <img id="tank-image" src="assets/berserker_v2.png" alt="Tank">
        </div>
      </div>
      <div class="tank-info">
        <h2 id="current-tank-name">Berserker V2</h2>
        <p id="tank-perk">Обычный обдув</p>
      </div>
    </main>

    <!-- Вкладка выбора баков -->
    <section class="view-tab" id="tab-tanks">
      <h2>Коллекция баков</h2>
      <div class="grid" id="tanks-list"></div>
    </section>

    <!-- Вкладка кейсов -->
    <section class="view-tab" id="tab-cases">
      <h2>Кейсы за клики</h2>
      <div class="grid" id="cases-list"></div>
    </section>

    <!-- Вкладка инвентаря купонов -->
    <section class="view-tab" id="tab-coupons">
      <h2>Мои купоны</h2>
      <div class="coupons-list" id="coupons-container">
        <p class="empty-text">Вы пока не выбили купоны на кейсы АКБ.</p>
      </div>
    </section>

    <!-- Нижняя навигация -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="tab-game">Кликер</button>
      <button class="nav-btn" data-tab="tab-tanks">Баки</button>
      <button class="nav-btn" data-tab="tab-cases">Кейсы</button>
      <button class="nav-btn" data-tab="tab-coupons">Купоны</button>
    </nav>
  </div>

  <!-- Модалка выпадения дропа -->
  <div class="modal hidden" id="drop-modal">
    <div class="modal-content">
      <h3 id="modal-title">Дроп!</h3>
      <div class="drop-icon" id="modal-icon">📦</div>
      <p id="modal-desc">Вы получили...</p>
      <button class="primary-btn" id="modal-close">Забрать</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
